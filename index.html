<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>我的待办</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ── TOKENS ── */
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#ffffff;--color-surface-2:#f9f8f5;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7672;--color-text-faint:#b8b5af;
  --color-primary:#7c5cff;--color-primary-hover:#6948ee;--color-primary-light:#efe9ff;
  --color-q1:#d946ef;--color-q1-bg:#f9edff;
  --color-q2:#8b5cf6;--color-q2-bg:#f3edff;
  --color-q3:#a855f7;--color-q3-bg:#f6edff;
  --color-q4:#7c3aed;--color-q4-bg:#f1ebff;
  --color-success:#437a22;--color-error:#c0392b;--color-warning:#d97706;
  --color-holiday:#c0392b;--color-term:#2a7d6f;--color-festival:#7c3aed;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 12px rgba(0,0,0,.09);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --text-xs:12px;--text-sm:13px;--text-base:15px;--text-lg:17px;--text-xl:20px;--text-2xl:26px;
  --font-body:'Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.4,0,1,1);
  --nav-h:58px;
}
[data-theme="dark"]{
  --color-bg:#131218;--color-surface:#1c1b22;--color-surface-2:#232130;
  --color-surface-offset:#2a2835;--color-border:#323832;--color-divider:#2a2e2a;
  --color-text:#d4d2e0;--color-text-muted:#9490a8;--color-text-faint:#5a5670;
  --color-primary:#a78bfa;--color-primary-hover:#8f72f6;--color-primary-light:#2b2142;
  --color-q1:#f472b6;--color-q1-bg:#34182c;
  --color-q2:#a78bfa;--color-q2-bg:#261d3a;
  --color-q3:#c084fc;--color-q3-bg:#2c1a3a;
  --color-q4:#8b5cf6;--color-q4-bg:#221a33;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);min-height:100dvh;overflow-x:hidden}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit;background:none}
img{display:block;max-width:100%}
*:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── NAV ── */
.top-nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;height:var(--nav-h);padding:0 var(--space-4);background:var(--color-surface);border-bottom:1px solid var(--color-divider);box-shadow:var(--shadow-sm);gap:var(--space-4)}
.nav-logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-lg);color:var(--color-primary);flex-shrink:0}
.nav-logo svg{flex-shrink:0}
.nav-tabs{display:flex;gap:var(--space-1);flex:1;justify-content:center}
.tab-btn{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted);transition:all .18s var(--ease-out);white-space:nowrap}
.tab-btn svg{width:16px;height:16px;flex-shrink:0}
.tab-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.tab-btn.active{background:var(--color-primary-light);color:var(--color-primary);font-weight:600}
.nav-actions{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;transition:all .18s var(--ease-out);white-space:nowrap;border:1.5px solid transparent}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);box-shadow:var(--shadow-sm)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{color:var(--color-text-muted);border-color:transparent}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-icon{padding:var(--space-2);border-radius:var(--radius-md)}
.btn-sm{padding:4px 10px;font-size:var(--text-xs)}
.btn-danger{background:var(--color-q1-bg);color:var(--color-q1);border-color:var(--color-q1)}
.btn-danger:hover{background:var(--color-q1);color:#fff}

/* ── PANELS ── */
.main{padding:var(--space-6) var(--space-4);max-width:1100px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .2s var(--ease-out)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── CALENDAR ── */
.cal-shell{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);overflow:hidden}
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--color-divider);gap:var(--space-3)}
.cal-toolbar-l,.cal-toolbar-r{display:flex;align-items:center;gap:var(--space-2)}
.cal-title{font-size:var(--text-xl);font-weight:700;min-width:120px;text-align:center}
.view-switcher{display:flex;gap:2px;background:var(--color-surface-offset);border-radius:var(--radius-md);padding:2px}
.view-btn{padding:4px 12px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--color-text-muted);transition:all .15s}
.view-btn.active{background:var(--color-surface);color:var(--color-primary);font-weight:600;box-shadow:var(--shadow-sm)}

/* Month grid */
.cal-grid-wrap{padding:var(--space-4) var(--space-4) var(--space-6)}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:var(--space-2)}
.cal-dow{text-align:center;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);padding:var(--space-2) 0;text-transform:uppercase;letter-spacing:.05em}
.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{min-height:80px;border-radius:var(--radius-md);padding:var(--space-2);cursor:pointer;transition:all .15s var(--ease-out);position:relative;background:var(--color-surface-2);border:1.5px solid transparent}
.cal-cell:hover{background:var(--color-surface-offset);border-color:var(--color-border)}
.cal-cell.out{opacity:.35}
.cal-cell.today .cal-num{background:var(--color-primary);color:#fff;border-radius:var(--radius-full);width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-cell.selected{border-color:var(--color-primary);background:var(--color-primary-light)}
.cal-cell.weekend .cal-num{color:var(--color-q1)}
.cal-num{font-size:var(--text-sm);font-weight:600;line-height:1;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal-lbl{font-size:10px;margin-top:2px;border-radius:3px;padding:1px 4px;font-weight:500;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-lbl.holiday{background:rgba(192,57,43,.12);color:var(--color-holiday)}
.cal-lbl.workday{background:rgba(100,116,139,.12);color:var(--color-q4)}
.cal-lbl.term{background:rgba(42,125,111,.12);color:var(--color-term)}
.cal-lbl.festival{background:rgba(124,58,237,.1);color:var(--color-festival)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.cal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-dot.q1{background:var(--color-q1)}.cal-dot.q2{background:var(--color-q2)}
.cal-dot.q3{background:var(--color-q3)}.cal-dot.q4{background:var(--color-q4)}
.cal-dot.none{background:var(--color-text-faint)}

/* Week / Day / Hour views */
.cal-week-wrap{padding:var(--space-4)}
.cal-week-header{display:grid;grid-template-columns:56px repeat(7,1fr);gap:2px;margin-bottom:var(--space-2)}
.cal-week-col-hd{text-align:center;padding:var(--space-2);cursor:pointer;border-radius:var(--radius-md);transition:background .15s}
.cal-week-col-hd:hover{background:var(--color-surface-offset)}
.cal-week-col-hd .wk-dow{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:600}
.cal-week-col-hd .wk-date{font-size:var(--text-lg);font-weight:700;width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin:2px auto;border-radius:var(--radius-full)}
.cal-week-col-hd.today .wk-date{background:var(--color-primary);color:#fff}
.cal-allday{display:grid;grid-template-columns:56px repeat(7,1fr);gap:2px;background:var(--color-surface-offset);border-radius:var(--radius-md);padding:var(--space-2);margin-bottom:var(--space-3)}
.cal-allday-label{font-size:var(--text-xs);color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.cal-allday-col{min-height:28px;display:flex;flex-direction:column;gap:2px}
.cal-week-chip{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--color-q2-bg);color:var(--color-q2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:filter .15s}
.cal-week-chip:hover{filter:brightness(.92)}
.cal-week-chip.q1{background:var(--color-q1-bg);color:var(--color-q1)}
.cal-week-chip.q2{background:var(--color-q2-bg);color:var(--color-q2)}
.cal-week-chip.q3{background:var(--color-q3-bg);color:var(--color-q3)}
.cal-week-chip.q4{background:var(--color-q4-bg);color:var(--color-q4)}
.cal-day-view,.cal-hour-view{padding:var(--space-4)}
.cal-day-hero{font-size:var(--text-2xl);font-weight:800;margin-bottom:var(--space-4)}
.cal-hour-grid{display:flex;flex-direction:column}
.cal-hour-row{display:grid;grid-template-columns:56px 1fr;gap:var(--space-2);min-height:36px;border-top:1px solid var(--color-divider)}
.cal-hour-row:last-child{border-bottom:1px solid var(--color-divider)}
.cal-hour-label{font-size:var(--text-xs);color:var(--color-text-faint);padding:4px 0;text-align:right;padding-right:var(--space-2)}

/* ── TASKS PANEL ── */
.tasks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);flex-wrap:wrap;gap:var(--space-3)}
.tasks-header h2{font-size:var(--text-xl);font-weight:700}
.filter-bar{display:flex;gap:var(--space-1);background:var(--color-surface-offset);border-radius:var(--radius-md);padding:2px}
.filter-btn{padding:5px 12px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--color-text-muted);transition:all .15s}
.filter-btn.active{background:var(--color-surface);color:var(--color-primary);font-weight:600;box-shadow:var(--shadow-sm)}

/* Quadrant layout */
.quadrant-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.q-panel{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-sm);border:1.5px solid var(--color-border);transition:box-shadow .2s}
.q-panel:hover{box-shadow:var(--shadow-md)}
.q-panel-hd{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-divider)}
.q-badge{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.q-panel-title{font-weight:700;font-size:var(--text-base)}
.q-panel-sub{font-size:var(--text-xs);color:var(--color-text-muted);margin-left:auto}
.q-panel.q1 .q-badge{background:var(--color-q1)}.q-panel.q1{border-color:rgba(192,57,43,.2)}
.q-panel.q2 .q-badge{background:var(--color-q2)}.q-panel.q2{border-color:rgba(42,125,111,.2)}
.q-panel.q3 .q-badge{background:var(--color-q3)}.q-panel.q3{border-color:rgba(217,119,6,.2)}
.q-panel.q4 .q-badge{background:var(--color-q4)}.q-panel.q4{border-color:rgba(100,116,139,.2)}
.q-tasks{display:flex;flex-direction:column;gap:var(--space-2);min-height:60px}

/* Task card */
.task-card{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-3);background:var(--color-surface-2);border-radius:var(--radius-md);border:1.5px solid var(--color-border);transition:all .18s var(--ease-out);cursor:pointer}
.task-card:hover{background:var(--color-surface-offset);border-color:var(--color-primary);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.task-card.done{opacity:.6}
.task-check{flex-shrink:0;width:22px;height:22px;border-radius:var(--radius-full);border:2px solid var(--color-border);display:flex;align-items:center;justify-content:center;transition:all .18s;margin-top:1px}
.task-check:hover{border-color:var(--color-primary);background:var(--color-primary-light)}
.task-check.done{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.task-check svg{width:12px;height:12px}
.task-body{flex:1;min-width:0}
.task-name{font-size:var(--text-sm);font-weight:600;line-height:1.4;word-break:break-word}
.task-name.done{text-decoration:line-through;color:var(--color-text-muted)}
.task-desc{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:3px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1);margin-top:var(--space-2)}
.tag{font-size:10px;padding:2px 7px;border-radius:var(--radius-full);background:var(--color-surface-offset);color:var(--color-text-muted);border:1px solid var(--color-border);font-weight:500}
.task-ddl{font-size:10px;padding:2px 7px;border-radius:var(--radius-full);background:var(--color-surface-offset);color:var(--color-text-muted);display:flex;align-items:center;gap:3px;border:1px solid var(--color-border)}
.task-ddl.overdue{background:rgba(192,57,43,.1);color:var(--color-q1);border-color:rgba(192,57,43,.25)}
.task-ddl svg{width:10px;height:10px}
.task-actions{display:flex;gap:2px;flex-shrink:0;opacity:0;transition:opacity .15s}
.task-card:hover .task-actions{opacity:1}
.task-actions .btn-icon{width:26px;height:26px;padding:0;border-radius:var(--radius-sm);font-size:var(--text-xs)}
.task-actions .btn-icon svg{width:13px;height:13px}

/* ── DAYS MATTER ── */
.dm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)}
.dm-header h2{font-size:var(--text-xl);font-weight:700}
.dm-header p{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:2px}
.dm-section-title{font-family:'Georgia','Times New Roman',serif;font-size:clamp(1.1rem,2vw,1.35rem);font-weight:700;letter-spacing:.04em;color:var(--color-text-muted);text-transform:uppercase;margin-bottom:var(--space-4);padding-bottom:var(--space-2);border-bottom:1.5px solid var(--color-divider);font-style:italic}
.dm-section{margin-bottom:var(--space-8)}
.dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4)}
.dm-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-5);box-shadow:var(--shadow-sm);border:1.5px solid var(--color-border);transition:all .2s var(--ease-out);cursor:pointer;position:relative}
.dm-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--color-primary)}
.dm-card__emoji{font-size:32px;margin-bottom:var(--space-3);line-height:1}
.dm-card__name{font-size:var(--text-base);font-weight:700;margin-bottom:var(--space-2)}
.dm-card__date{font-size:var(--text-xs);color:var(--color-text-muted)}
.dm-card__days{font-size:var(--text-2xl);font-weight:800;color:var(--color-primary);margin-top:var(--space-2)}
.dm-card__days-label{font-size:var(--text-xs);color:var(--color-text-muted)}
.dm-card__note{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-2);font-style:italic}
.dm-card__del{position:absolute;top:var(--space-2);right:var(--space-2);opacity:0;transition:opacity .15s}
.dm-card:hover .dm-card__del{opacity:1}
.dm-past .dm-card__days{color:var(--color-text-muted)}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-12) var(--space-8);text-align:center;color:var(--color-text-muted)}
.empty svg{width:40px;height:40px;margin-bottom:var(--space-4);opacity:.4}
.empty h3{font-size:var(--text-lg);font-weight:700;color:var(--color-text);margin-bottom:var(--space-2)}
.empty p{font-size:var(--text-sm);max-width:28ch}

/* ── DRAWER ── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:300;opacity:0;pointer-events:none;transition:opacity .22s var(--ease-out)}
.backdrop.show{opacity:1;pointer-events:all}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--color-surface);z-index:400;transform:translateX(100%);transition:transform .28s var(--ease-out);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-left:1px solid var(--color-border)}
.drawer.open{transform:none}
.drawer-hd{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-divider);flex-shrink:0}
.drawer-title{font-size:var(--text-lg);font-weight:700;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-5)}

/* ── MODAL ── */
.modal-wrap{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:var(--space-4);opacity:0;pointer-events:none;transition:opacity .22s}
.modal-wrap.open{opacity:1;pointer-events:all}
.modal-box{background:var(--color-surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:500px;max-height:90dvh;overflow-y:auto;transform:translateY(12px) scale(.97);transition:transform .25s var(--ease-out)}
.modal-wrap.open .modal-box{transform:none}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:var(--color-surface);z-index:2}
.modal-title{font-size:var(--text-xl);font-weight:700}
.modal-body{padding:var(--space-5) var(--space-6) var(--space-6)}

/* ── FORMS ── */
.form-group{margin-bottom:var(--space-4)}
.form-label{display:block;font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-2);color:var(--color-text)}
.form-hint{font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2)}
.form-input,.form-textarea{width:100%;padding:10px var(--space-3);border:1.5px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);background:var(--color-surface-2);transition:border-color .15s,box-shadow .15s;outline:none}
.form-input:focus,.form-textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(42,125,111,.12)}
.form-textarea{resize:vertical;min-height:72px;line-height:1.6}
.form-actions{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--color-divider)}
.btn-secondary{background:var(--color-surface-offset);color:var(--color-text-muted);border-color:var(--color-border)}
.btn-secondary:hover{background:var(--color-border);color:var(--color-text)}

/* Status selector */
.status-sel{display:flex;gap:var(--space-2);flex-wrap:wrap}
.status-opt{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-md);border:1.5px solid var(--color-border);font-size:var(--text-sm);transition:all .15s;color:var(--color-text-muted)}
.status-opt svg{width:15px;height:15px}
.status-opt:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-light)}
.status-opt.active{border-color:var(--color-primary);background:var(--color-primary-light);color:var(--color-primary);font-weight:600}

/* Tag selector */
.tag-sel{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-bottom:var(--space-2)}
.tag-opt{padding:4px 12px;border-radius:var(--radius-full);border:1.5px solid var(--color-border);font-size:var(--text-xs);font-weight:500;cursor:pointer;transition:all .15s;color:var(--color-text-muted);background:var(--color-surface-2)}
.tag-opt:hover{border-color:var(--color-primary);color:var(--color-primary)}
.tag-opt.active{border-color:var(--color-primary);background:var(--color-primary-light);color:var(--color-primary)}
.tag-add-row{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
.tag-add-row .form-input{margin:0}

/* Quadrant picker */
.q-picker{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
.q-opt{padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:600;cursor:pointer;transition:all .15s;border:none;text-align:left;line-height:1.3}
.q-opt small{display:block;font-size:10px;font-weight:400;opacity:.75;margin-top:2px}
.q-opt:hover{filter:brightness(.92)}
.q-opt.active{box-shadow:inset 0 0 0 2px var(--color-text);}
.q-opt.q1{background:var(--color-q1-bg);color:var(--color-q1)}.q-opt.q2{background:var(--color-q2-bg);color:var(--color-q2)}
.q-opt.q3{background:var(--color-q3-bg);color:var(--color-q3)}.q-opt.q4{background:var(--color-q4-bg);color:var(--color-q4)}

/* DM emoji picker */
.emoji-row{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.emoji-opt{width:38px;height:38px;border-radius:var(--radius-md);border:1.5px solid var(--color-border);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.emoji-opt:hover{border-color:var(--color-primary);transform:scale(1.1)}
.emoji-opt.active{border-color:var(--color-primary);background:var(--color-primary-light);box-shadow:0 0 0 2px var(--color-primary)}

/* ── TOAST ── */
#toast-container{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:var(--space-2);pointer-events:none}
.toast{background:var(--color-text);color:var(--color-bg);padding:10px 20px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .28s var(--ease-out) both}
.toast.success{background:var(--color-success);color:#fff}
.toast.error{background:var(--color-error);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ── THEME TOGGLE ── */
.theme-btn{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:all .15s}
.theme-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.theme-btn svg{width:18px;height:18px}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .quadrant-grid{grid-template-columns:1fr}
  .top-nav .nav-logo span{display:none}
  .tab-btn span{display:none}
  .tab-btn{padding:var(--space-2) var(--space-3)}
  .btn-primary .btn-label{display:none}
  .dm-grid{grid-template-columns:1fr 1fr}
  .cal-cell{min-height:56px}
  .main{padding:var(--space-4) var(--space-3)}
}
@media(max-width:480px){
  .dm-grid{grid-template-columns:1fr}
  .cal-toolbar{flex-wrap:wrap;padding:var(--space-3)}
  .cal-cell{min-height:44px;padding:var(--space-1)}
  .cal-num{font-size:11px;width:20px;height:20px}
  .cal-lbl{display:none}
}

/* ============================================================
   DATA STORE
============================================================ */
var Store = (function(){
  var KEYS = { tasks:'tdm_tasks', dm:'tdm_dm', tags:'tdm_tags' };
  var DEFAULT_TAGS = ['工作','学习','生活','健康','财务','社交','创作'];
  function rd(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
  function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  return {
    uid: uid,
    getTasks:   function(){ return rd(KEYS.tasks,[]); },
    saveTasks:  function(a){ wr(KEYS.tasks,a); },
    getTags:    function(){ return rd(KEYS.tags,DEFAULT_TAGS.slice()); },
    saveTags:   function(a){ wr(KEYS.tags,a); },
    getDM:      function(){ return rd(KEYS.dm,[]); },
    saveDM:     function(a){ wr(KEYS.dm,a); },
  };
})();

/* ============================================================

============================================================ */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO(){ var d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return d.getFullYear()+'-'+m+'-'+day; }
function fmtDate(d){ var m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return d.getFullYear()+'-'+m+'-'+day; }
function isOverdue(ddl,status){ if(!ddl||status==='done') return false; var t=new Date(); t.setHours(0,0,0,0); return new Date(ddl+'T00:00:00')<t; }
function diffDays(isoDate){
  var today=new Date(); today.setHours(0,0,0,0);
  var target=new Date(isoDate+'T00:00:00');
  return Math.round((target-today)/(1000*60*60*24));
}
function showToast(msg,type,dur){
  var c=document.getElementById('toast-container');
  var el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg;
  c.appendChild(el);
  setTimeout(function(){ el.style.animation='toastOut .28s forwards'; el.addEventListener('animationend',function(){ el.remove(); }); },dur||2400);
}
function reinitIcons(node){
  if(window.lucide) lucide.createIcons({nodes:node?[node]:[document.body]});
}

  '2026-05-04':['劳动节','holiday'],'2026-05-05':['劳动节','holiday'],
  '2026-06-19':['端午','holiday'],'2026-06-20':['端午','holiday'],'2026-06-21':['端午','holiday'],
  '2026-10-01':['国庆','holiday'],'2026-10-02':['国庆','holiday'],'2026-10-03':['国庆','holiday'],
  '2026-10-04':['国庆','holiday'],'2026-10-05':['国庆','holiday'],'2026-10-06':['国庆','holiday'],
  '2026-10-07':['国庆','holiday'],
};
var WESTERN = {'02-14':'情人节','03-08':'妇女节','04-01':'愚人节','06-01':'儿童节','10-31':'万圣节','12-24':'平安夜','12-25':'圣诞节'};
var JIEQI_NAMES=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
var JIEQI_C=[4.6295,19.4599,3.3872,18.8450,5.6300,20.6460,4.8107,20.9700,6.3780,21.9300,6.6765,22.7250,7.1017,23.0172,7.1983,23.1350,8.0044,23.6972,7.0625,22.6704,6.3306,21.9425,7.9214,21.9412];
var _stCache={};
function getSolarTerms(year){
  if(_stCache[year]) return _stCache[year];
  var r={};

  if(year===2026){
    r['2026-01-05']='小寒';
    r['2026-01-20']='大寒';
    r['2026-02-04']='立春';
    r['2026-02-19']='雨水';
    r['2026-03-05']='惊蛰';
    r['2026-03-20']='春分';
    r['2026-04-04']='清明';
    r['2026-04-20']='谷雨';
    r['2026-05-05']='立夏';
    r['2026-05-21']='小满';
    r['2026-06-05']='芒种';
    r['2026-06-21']='夏至';
    r['2026-07-07']='小暑';
    r['2026-07-23']='大暑';
    r['2026-08-07']='立秋';
    r['2026-08-23']='处暑';
    r['2026-09-07']='白露';
    r['2026-09-23']='秋分';
    r['2026-10-08']='寒露';
    r['2026-10-23']='霜降';
    r['2026-11-07']='立冬';
    r['2026-11-22']='小雪';
    r['2026-12-07']='大雪';
    r['2026-12-22']='冬至';
    _stCache[year]=r; return r;
  }

  for(var i=0;i<24;i++){
    var m=Math.floor(i/2)+1;
    var day=Math.floor((year%100)*0.2422+JIEQI_C[i])-Math.floor((year%100-1)/4);
    var d=new Date(year,m-1,day);
    if(!isNaN(d.getTime())) r[fmtDate(d)]=JIEQI_NAMES[i];
  }
  _stCache[year]=r; return r;
}
function getNthWeekday(year,month,weekday,n){
  var d=new Date(year,month-1,1),count=0;
  while(count<n){ if(d.getDay()===weekday) count++; if(count<n) d.setDate(d.getDate()+1); }
  return fmtDate(d);
}
var _vfCache={};
function getVarFestivals(year){
  if(_vfCache[year]) return _vfCache[year];
  var r={}; r[getNthWeekday(year,5,0,2)]='母亲节'; r[getNthWeekday(year,6,0,3)]='父亲节'; r[getNthWeekday(year,11,4,4)]='感恩节';
  _vfCache[year]=r; return r;
}
function getDayLabel(ds){
  if(CN_HOL[ds]) return CN_HOL[ds]; // [label,type]
  var y=parseInt(ds.slice(0,4),10);
  var st=getSolarTerms(y); if(st[ds]) return [st[ds],'term'];
  var vf=getVarFestivals(y); if(vf[ds]) return [vf[ds],'festival'];
  var mmdd=ds.slice(5); if(WESTERN[mmdd]) return [WESTERN[mmdd],'festival'];
  return null;
}

/* ============================================================
   CALENDAR MODULE
============================================================ */
var Cal = (function(){
  var now=new Date();
  var state={ view:'month', year:now.getFullYear(), month:now.getMonth(), sel:todayISO() };
  var MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var DOW=['一','二','三','四','五','六','日'];

  function setTitle(){
    var el=document.getElementById('cal-title');
    if(!el) return;
    if(state.view==='month') el.textContent=state.year+'年 '+MONTHS[state.month];
    else if(state.view==='week'){ var d=new Date(state.sel+'T00:00:00'); el.textContent=d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月 周视图'; }
    else { var d2=new Date(state.sel+'T00:00:00'); el.textContent=(d2.getMonth()+1)+'月'+d2.getDate()+'日'; }
  }

  function render(){
    setTitle();
    var body=document.getElementById('calendar-body');
    if(!body) return;
    if(state.view==='month') renderMonth(body);
    else if(state.view==='week') renderWeek(body);
    else if(state.view==='day') renderDay(body);
    else renderDay(body);
    reinitIcons(body);
  }

  function renderMonth(body){
    var tasks=Store.getTasks();
    var today=todayISO();
    var firstDay=new Date(state.year,state.month,1);
    var offset=(firstDay.getDay()-1+7)%7;
    var start=new Date(firstDay); start.setDate(start.getDate()-offset);

    var h='<div class="cal-grid-wrap">';
    h+='<div class="cal-dow-row">';
    DOW.forEach(function(d){ h+='<div class="cal-dow">'+d+'</div>'; });
    h+='</div><div class="cal-month-grid">';

    for(var i=0;i<42;i++){
      var d=new Date(start); d.setDate(d.getDate()+i);
      var ds=fmtDate(d);
      var inM=d.getMonth()===state.month;
      var isToday=ds===today, isSel=ds===state.sel;
      var isWE=d.getDay()===0||d.getDay()===6;
      var lbl=getDayLabel(ds);
      var dayTasks=tasks.filter(function(t){ return t.ddl===ds; });
      var cls='cal-cell'+(inM?'':' out')+(isToday?' today':'')+(isSel&&!isToday?' selected':'')+(isWE?' weekend':'');
      h+='<div class="'+cls+'" data-date="'+ds+'" role="button" tabindex="0" aria-label="'+ds+'">';
      h+='<div class="cal-num">'+d.getDate()+'</div>';
      if(lbl) h+='<div class="cal-lbl '+lbl[1]+'">'+lbl[0]+'</div>';
      if(dayTasks.length){
        h+='<div class="cal-dots">';
        dayTasks.slice(0,4).forEach(function(t){ h+='<div class="cal-dot '+(t.quadrant||'none')+'"></div>'; });
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</div></div>';
    body.innerHTML=h;
    body.querySelectorAll('.cal-cell').forEach(function(el){
      el.addEventListener('click',function(){ onDateClick(el.dataset.date); });
      el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onDateClick(el.dataset.date); } });
    });
  }

  function renderWeek(body){
    var tasks=Store.getTasks(); var today=todayISO();
    var d=new Date(state.sel+'T00:00:00');
    var off=(d.getDay()-1+7)%7;
    var start=new Date(d); start.setDate(d.getDate()-off);
    var days=[]; for(var i=0;i<7;i++){ var x=new Date(start); x.setDate(start.getDate()+i); days.push(fmtDate(x)); }

    var h='<div class="cal-week-wrap">';
    h+='<div class="cal-week-header"><div style="min-width:56px"></div>';
    days.forEach(function(ds){
      var dd=new Date(ds+'T00:00:00'); var lbl=getDayLabel(ds); var isT=ds===today;
      h+='<div class="cal-week-col-hd'+(isT?' today':'')+'" data-date="'+ds+'">';
      h+='<div class="wk-dow">'+DOW[(dd.getDay()+6)%7]+'</div>';
      h+='<div class="wk-date">'+dd.getDate()+'</div>';
      if(lbl) h+='<div class="cal-lbl '+lbl[1]+'" style="font-size:9px">'+lbl[0]+'</div>';
      h+='</div>';
    });
    h+='</div>';
    h+='<div class="cal-allday"><div class="cal-allday-label">全天</div>';
    days.forEach(function(ds){
      var dt=tasks.filter(function(t){ return t.ddl===ds; });
      h+='<div class="cal-allday-col">';
      dt.forEach(function(t){ h+='<div class="cal-week-chip '+(t.quadrant||'q2')+'" data-id="'+t.id+'" title="'+esc(t.name)+'">'+esc(t.name)+'</div>'; });
      h+='</div>';
    });
    h+='</div></div>';
    body.innerHTML=h;
    body.querySelectorAll('.cal-week-col-hd').forEach(function(el){ el.addEventListener('click',function(){ onDateClick(el.dataset.date); }); });
    body.querySelectorAll('.cal-week-chip').forEach(function(el){ el.addEventListener('click',function(e){ e.stopPropagation(); Tasks.openEdit(el.dataset.id); }); });
  }

  function renderDay(body){
    var tasks=Store.getTasks(); var ds=state.sel;
    var d=new Date(ds+'T00:00:00'); var lbl=getDayLabel(ds);
    var dayTasks=tasks.filter(function(t){ return t.ddl===ds; });
    var h='<div class="cal-day-view"><div style="padding:var(--space-4) var(--space-6) var(--space-2)">';
    h+='<div style="display:flex;align-items:center;gap:var(--space-3)">';
    h+='<span class="cal-day-hero">'+(d.getMonth()+1)+'月'+d.getDate()+'日</span>';
    if(lbl) h+='<span class="cal-lbl '+lbl[1]+'">'+lbl[0]+'</span>';
    h+='</div></div>';
    if(!dayTasks.length){
      h+=renderEmpty('sun','这天还没有任务','点击右上角 + 新建');
    } else {
      h+='<div style="padding:0 var(--space-6) var(--space-6);display:flex;flex-direction:column;gap:var(--space-2)">';
      dayTasks.forEach(function(t){ h+=renderTaskCard(t); }); h+='</div>';
    }
    h+='</div>';
    body.innerHTML=h;
    attachCardHandlers(body);
  }

  function renderHour(body){
    var ds=state.sel; var d=new Date(ds+'T00:00:00');
    var h='<div class="cal-hour-view"><div style="padding:var(--space-4) var(--space-6)"><span class="cal-day-hero">'+(d.getMonth()+1)+'月'+d.getDate()+'日 时间轴</span></div>';
    h+='<div class="cal-hour-grid" style="padding:0 var(--space-6) var(--space-6)">';
    for(var i=0;i<24;i++){
      h+='<div class="cal-hour-row"><div class="cal-hour-label">'+String(i).padStart(2,'0')+':00</div><div></div></div>';
    }
    h+='</div></div>';
    body.innerHTML=h;
  }

  function onDateClick(ds){
    state.sel=ds; var dd=new Date(ds+'T00:00:00');
    state.year=dd.getFullYear(); state.month=dd.getMonth();
    Drawer.open(ds); render();
  }

  function navigate(dir){
    if(state.view==='month'){ state.month+=dir; if(state.month>11){state.month=0;state.year++;} if(state.month<0){state.month=11;state.year--;} }
    else if(state.view==='week'){ var d=new Date(state.sel+'T00:00:00'); d.setDate(d.getDate()+dir*7); state.sel=fmtDate(d); state.year=d.getFullYear(); state.month=d.getMonth(); }
    else { var d2=new Date(state.sel+'T00:00:00'); d2.setDate(d2.getDate()+dir); state.sel=fmtDate(d2); state.year=d2.getFullYear(); state.month=d2.getMonth(); }
    render();
  }

  function init(){
    document.getElementById('cal-prev').addEventListener('click',function(){ navigate(-1); });
    document.getElementById('cal-next').addEventListener('click',function(){ navigate(1); });
    document.getElementById('cal-today').addEventListener('click',function(){ var n=new Date(); state.year=n.getFullYear(); state.month=n.getMonth(); state.sel=todayISO(); render(); });
    document.querySelectorAll('.view-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('.view-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active'); state.view=btn.dataset.view; render();
      });
    });
    render();
  }

  return { init:init, render:render, getState:function(){ return state; } };
})();

function renderEmpty(icon,title,sub){
  return '<div class="empty"><i data-lucide="'+icon+'"></i><h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p></div>';
}

var Q_LABELS={q1:'紧急重要',q2:'重要不紧急',q3:'紧急不重要',q4:'不紧急不重要'};

function renderTaskCard(t){
  var isDone=t.status==='done';
  var statusIcon={todo:'circle',doing:'loader-circle',done:'circle-check'}[t.status]||'circle';
  var tagsH=(t.tags||[]).map(function(tg){ return '<span class="tag">'+esc(tg)+'</span>'; }).join('');
  var ddlH=t.ddl?('<span class="task-ddl'+(isOverdue(t.ddl,t.status)?' overdue':'')+'"><i data-lucide="calendar-clock"></i>'+esc(t.ddl.slice(5))+'</span>'):'';
  var qH=t.quadrant&&Q_LABELS[t.quadrant]?('<span class="tag" style="border-color:var(--color-'+t.quadrant+');color:var(--color-'+t.quadrant+')">'+Q_LABELS[t.quadrant]+'</span>'):'';
  return '<div class="task-card'+(isDone?' done':'')+'" data-id="'+t.id+'" tabindex="0">'
    +'<button class="task-check'+(isDone?' done':'')+'" data-id="'+t.id+'" aria-label="切换完成状态"><i data-lucide="'+statusIcon+'"></i></button>'
    +'<div class="task-body">'
    +'<p class="task-name'+(isDone?' done':'')+'">'+esc(t.name)+'</p>'
    +(t.desc?'<p class="task-desc">'+esc(t.desc)+'</p>':'')
    +'<div class="task-meta">'+qH+tagsH+ddlH+'</div>'
    +'</div>'
    +'<div class="task-actions">'
    +'<button class="btn btn-ghost btn-icon task-edit-btn" data-id="'+t.id+'" aria-label="编辑"><i data-lucide="pencil"></i></button>'
    +'</div></div>';
}

function attachCardHandlers(container){
  container.querySelectorAll('.task-check').forEach(function(btn){
    btn.addEventListener('click',function(e){ e.stopPropagation(); Tasks.toggleDone(btn.dataset.id); });
  });
  container.querySelectorAll('.task-edit-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){ e.stopPropagation(); Tasks.openEdit(btn.dataset.id); });
  });
  container.querySelectorAll('.task-card').forEach(function(card){
    card.addEventListener('click',function(e){ if(!e.target.closest('button')) Tasks.openEdit(card.dataset.id); });
    card.addEventListener('keydown',function(e){ if(e.key==='Enter') Tasks.openEdit(card.dataset.id); });
  });
  if(window.lucide) lucide.createIcons({nodes:[container]});
}

/* ============================================================
   TASKS MODULE
============================================================ */
var Tasks = (function(){
  var currentFilter='all';
  var currentId=null;
  var drawerDate=null; // prefill ddl when opening from drawer

  function render(){
    var board=document.getElementById('tasks-board');
    if(!board) return;
    var all=Store.getTasks();
    var filtered=currentFilter==='all'?all:all.filter(function(t){ return t.status===currentFilter; });

    var q1=filtered.filter(function(t){ return t.quadrant==='q1'; });
    var q2=filtered.filter(function(t){ return t.quadrant==='q2'; });
    var q3=filtered.filter(function(t){ return t.quadrant==='q3'; });
    var q4=filtered.filter(function(t){ return t.quadrant==='q4'; });
    var noq=filtered.filter(function(t){ return !t.quadrant; });

    function panel(q,title,sub,list){
      var h='<div class="q-panel '+q+'"><div class="q-panel-hd"><div class="q-badge"></div><span class="q-panel-title">'+title+'</span><span class="q-panel-sub">'+sub+'</span></div><div class="q-tasks">';
      if(!list.length) h+='<div style="color:var(--color-text-faint);font-size:var(--text-xs);text-align:center;padding:var(--space-4)">暂无任务</div>';
      else list.forEach(function(t){ h+=renderTaskCard(t); });
      h+='</div></div>';
      return h;
    }

    var h='<div class="quadrant-grid">';
    h+=panel('q1','🔴 紧急重要','立即处理',q1);
    h+=panel('q2','🟢 重要不紧急','计划安排',q2);
    h+=panel('q3','🟡 紧急不重要','委托他人',q3);
    h+=panel('q4','⚪ 不紧急不重要','考虑删除',q4);
    h+='</div>';

    if(noq.length){
      h+='<div style="margin-top:var(--space-4);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-sm)">';
      h+='<div style="font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);margin-bottom:var(--space-3)">未分类</div><div style="display:flex;flex-direction:column;gap:var(--space-2)">';
      noq.forEach(function(t){ h+=renderTaskCard(t); });
      h+='</div></div>';
    }

    if(!filtered.length){
      board.innerHTML=renderEmpty('inbox','还没有任务','点击右上角"新建任务"开始');
    } else {
      board.innerHTML=h;
    }
    attachCardHandlers(board);
  }

  function openNew(prefillDate){
    drawerDate=prefillDate||null;
    currentId=null;
    document.getElementById('modal-task-title').textContent='新建任务';
    document.getElementById('task-id').value='';
    document.getElementById('task-name').value='';
    document.getElementById('task-desc').value='';
    document.getElementById('task-ddl').value=prefillDate||'';
    setStatus('todo');
    setQuadrant('q2');
    document.getElementById('task-delete-btn').style.display='none';
    renderTagSel([]);
    Modal.open('modal-task');
    setTimeout(function(){ document.getElementById('task-name').focus(); },80);
  }

  function openEdit(id){
    var tasks=Store.getTasks();
    var t=tasks.find(function(x){ return x.id===id; });
    if(!t) return;
    currentId=id;
    document.getElementById('modal-task-title').textContent='编辑任务';
    document.getElementById('task-id').value=t.id;
    document.getElementById('task-name').value=t.name||'';
    document.getElementById('task-desc').value=t.desc||'';
    document.getElementById('task-ddl').value=t.ddl||'';
    setStatus(t.status||'todo');
    setQuadrant(t.quadrant||'q2');
    document.getElementById('task-delete-btn').style.display='';
    renderTagSel(t.tags||[]);
    Modal.open('modal-task');
    setTimeout(function(){ document.getElementById('task-name').focus(); },80);
  }

  function setStatus(s){
    document.querySelectorAll('#status-sel .status-opt').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.status===s);
    });
  }

  function setQuadrant(q){
    document.getElementById('task-quadrant').value=q;
    document.querySelectorAll('#q-picker .q-opt').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.q===q);
    });
  }

  function getStatus(){ var a=document.querySelector('#status-sel .status-opt.active'); return a?a.dataset.status:'todo'; }

  function renderTagSel(selected){
    var all=Store.getTags();
    var sel=document.getElementById('tag-sel');
    var h='';
    all.forEach(function(tag){
      var isA=selected.indexOf(tag)>=0;
      h+='<div class="tag-opt-wrap" style="display:inline-flex;align-items:center;gap:2px">';
      h+='<div class="tag-opt'+(isA?' active':'')+'" data-tag="'+esc(tag)+'">'+esc(tag)+'</div>';
      h+='<button type="button" class="tag-del-btn" data-tag="'+esc(tag)+'" aria-label="删除标签 '+esc(tag)+'" style="width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-faint);border:1px solid var(--color-border);background:var(--color-surface-offset);transition:all .15s;flex-shrink:0;padding:0;line-height:1">×</button>';
      h+='</div>';
    });
    sel.innerHTML=h;
    sel.querySelectorAll('.tag-opt').forEach(function(el){
      el.addEventListener('click',function(){ el.classList.toggle('active'); });
    });
    sel.querySelectorAll('.tag-del-btn').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var tag=btn.dataset.tag;
        if(!confirm('删除标签「'+tag+'」？（不会影响已有任务）')) return;
        var tags=Store.getTags().filter(function(t){ return t!==tag; });
        Store.saveTags(tags);
        var currentActive=Array.from(sel.querySelectorAll('.tag-opt.active')).map(function(el){ return el.dataset.tag; }).filter(function(t){ return t!==tag; });
        renderTagSel(currentActive);
      });
    });
  }

  function getSelectedTags(){
    return Array.from(document.querySelectorAll('#tag-sel .tag-opt.active')).map(function(el){ return el.dataset.tag; });
  }

  function handleSubmit(e){
    e.preventDefault();
    var name=document.getElementById('task-name').value.trim();
    if(!name){ document.getElementById('task-name').focus(); showToast('请填写任务名称','error'); return; }
    var tasks=Store.getTasks();
    var task={
      id: currentId||Store.uid(),
      name:name,
      desc:document.getElementById('task-desc').value.trim(),
      ddl:document.getElementById('task-ddl').value||null,
      status:getStatus(),
      quadrant:document.getElementById('task-quadrant').value||null,
      tags:getSelectedTags(),
      createdAt:Date.now(),
    };
    if(currentId){
      var idx=tasks.findIndex(function(t){ return t.id===currentId; });
      if(idx>=0){ var old=tasks[idx]; task.createdAt=old.createdAt; tasks[idx]=task; }
      else tasks.unshift(task);
    } else {
      tasks.unshift(task);
    }
    Store.saveTasks(tasks);
    Modal.close('modal-task');
    render();
    Cal.render();
    if(Drawer.isOpen()&&Drawer.getDate()===task.ddl) Drawer.refresh(task.ddl);
    showToast(currentId?'任务已更新 ✓':'任务已创建 ✓','success');
  }

  function deleteTask(){
    if(!currentId) return;
    var tasks=Store.getTasks().filter(function(t){ return t.id!==currentId; });
    Store.saveTasks(tasks);
    Modal.close('modal-task');
    render(); Cal.render();
    showToast('任务已删除');
  }

  function toggleDone(id){
    var tasks=Store.getTasks();
    var t=tasks.find(function(x){ return x.id===id; });
    if(!t) return;
    var cycle={todo:'doing',doing:'done',done:'todo'};
    t.status=cycle[t.status]||'todo';
    Store.saveTasks(tasks);
    render(); Cal.render();
    if(Drawer.isOpen()&&Drawer.getDate()===t.ddl) Drawer.refresh(t.ddl);
  }

  function initFilter(){
    document.querySelectorAll('.filter-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active'); currentFilter=btn.dataset.filter; render();
      });
    });
  }

  function initForm(){
    document.querySelectorAll('#status-sel .status-opt').forEach(function(btn){
      btn.addEventListener('click',function(){ setStatus(btn.dataset.status); });
    });
    document.querySelectorAll('#q-picker .q-opt').forEach(function(btn){
      btn.addEventListener('click',function(){ setQuadrant(btn.dataset.q); });
    });
    document.getElementById('task-form').addEventListener('submit',handleSubmit);
    document.getElementById('modal-task-cancel').addEventListener('click',function(){ Modal.close('modal-task'); });
    document.getElementById('modal-task-close').addEventListener('click',function(){ Modal.close('modal-task'); });
    document.getElementById('task-delete-btn').addEventListener('click',deleteTask);
    var tagInput=document.getElementById('tag-new');
    var tagAddBtn=document.getElementById('tag-add-btn');
    function addTag(){
      var v=tagInput.value.trim(); if(!v) return;
      var tags=Store.getTags();
      if(tags.indexOf(v)<0){ tags.push(v); Store.saveTags(tags); }
      var sel=document.querySelectorAll('#tag-sel .tag-opt.active');
      var active=Array.from(sel).map(function(el){ return el.dataset.tag; });
      if(active.indexOf(v)<0) active.push(v);
      renderTagSel(active);
      tagInput.value='';
    }
    tagInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addTag(); } });
    tagAddBtn.addEventListener('click',addTag);
  }

  function init(){
    document.getElementById('btn-new-task').addEventListener('click',function(){ openNew(); });
    initFilter(); initForm(); render();
  }

  return { init:init, render:render, openNew:openNew, openEdit:openEdit, toggleDone:toggleDone };
})();

/* ============================================================
   DAYSMATTER MODULE
============================================================ */
var DM = (function(){
  var currentId=null;

  function diffLabel(ds){
    var d=diffDays(ds);
    if(d===0) return { n:'今天', past:false };
    if(d>0) return { n:'还有 '+d+' 天', past:false };
    return { n:'已过 '+Math.abs(d)+' 天', past:true };
  }

  function renderCard(item){
    var dl=diffLabel(item.date);
    var h='<div class="dm-card'+(dl.past?' dm-past':'')+'" data-id="'+item.id+'">';
    h+='<button class="dm-card__del btn btn-ghost btn-icon" data-id="'+item.id+'" aria-label="删除"><i data-lucide="x"></i></button>';
    h+='<div class="dm-card__emoji">'+item.emoji+'</div>';
    h+='<div class="dm-card__name">'+esc(item.name)+'</div>';
    h+='<div class="dm-card__date">'+item.date+'</div>';
    h+='<div class="dm-card__days">'+dl.n+'</div>';
    if(item.note) h+='<div class="dm-card__note">'+esc(item.note)+'</div>';
    h+='</div>';
    return h;
  }

  function render(){
    var list=document.getElementById('dm-list');
    if(!list) return;
    var items=Store.getDM();
    if(!items.length){
      list.innerHTML=renderEmpty('star','还没有重要日子','点击"添加日子"记录你的第一个');
      reinitIcons(list); return;
    }
    var upcoming=items.filter(function(i){ return diffDays(i.date)>=0; }).sort(function(a,b){ return diffDays(a.date)-diffDays(b.date); });
    var past=items.filter(function(i){ return diffDays(i.date)<0; }).sort(function(a,b){ return diffDays(b.date)-diffDays(a.date); });
    var h='';
    if(upcoming.length){
      h+='<div class="dm-section">';
      h+='<div class="dm-section-title">Upcoming</div>';
      h+='<div class="dm-grid">';
      upcoming.forEach(function(item){ h+=renderCard(item); });
      h+='</div></div>';
    }
    if(past.length){
      h+='<div class="dm-section">';
      h+='<div class="dm-section-title">Memories</div>';
      h+='<div class="dm-grid">';
      past.forEach(function(item){ h+=renderCard(item); });
      h+='</div></div>';
    }
    list.innerHTML=h;
    list.querySelectorAll('.dm-card').forEach(function(el){
      el.addEventListener('click',function(e){ if(!e.target.closest('.dm-card__del')) openEdit(el.dataset.id); });
    });
    list.querySelectorAll('.dm-card__del').forEach(function(btn){
      btn.addEventListener('click',function(e){ e.stopPropagation(); deleteItem(btn.dataset.id); });
    });
    reinitIcons(list);
  }

  function openNew(){
    currentId=null;
    document.getElementById('modal-dm-title').textContent='添加重要日子';
    document.getElementById('dm-id').value='';
    document.getElementById('dm-name').value='';
    document.getElementById('dm-date').value='';
    document.getElementById('dm-note').value='';
    setEmoji('⭐');
    document.getElementById('dm-delete-btn').style.display='none';
    Modal.open('modal-dm');
    setTimeout(function(){ document.getElementById('dm-name').focus(); },80);
  }

  function openEdit(id){
    var items=Store.getDM(); var item=items.find(function(x){ return x.id===id; }); if(!item) return;
    currentId=id;
    document.getElementById('modal-dm-title').textContent='编辑日子';
    document.getElementById('dm-id').value=item.id;
    document.getElementById('dm-name').value=item.name||'';
    document.getElementById('dm-date').value=item.date||'';
    document.getElementById('dm-note').value=item.note||'';
    setEmoji(item.emoji||'⭐');
    document.getElementById('dm-delete-btn').style.display='';
    Modal.open('modal-dm');
    setTimeout(function(){ document.getElementById('dm-name').focus(); },80);
  }

  function setEmoji(e){
    document.getElementById('dm-emoji').value=e;
    document.querySelectorAll('.emoji-opt').forEach(function(el){ el.classList.toggle('active',el.dataset.emoji===e); });
  }

  function handleSubmit(ev){
    ev.preventDefault();
    var name=document.getElementById('dm-name').value.trim();
    var date=document.getElementById('dm-date').value;
    if(!name||!date){ showToast('请填写名称和日期','error'); return; }
    var items=Store.getDM();
    var item={ id:currentId||Store.uid(), name:name, date:date, note:document.getElementById('dm-note').value.trim(), emoji:document.getElementById('dm-emoji').value||'⭐' };
    if(currentId){ var idx=items.findIndex(function(x){ return x.id===currentId; }); if(idx>=0) items[idx]=item; else items.push(item); }
    else items.push(item);
    Store.saveDM(items);
    Modal.close('modal-dm');
    render();
    showToast(currentId?'已更新 ✓':'已添加 ✓','success');
  }

  function deleteItem(id){
    var items=Store.getDM().filter(function(x){ return x.id!==id; });
    Store.saveDM(items);
    Modal.close('modal-dm'); render(); showToast('已删除');
  }

  function init(){
    document.getElementById('btn-new-dm').addEventListener('click',openNew);
    document.getElementById('modal-dm-cancel').addEventListener('click',function(){ Modal.close('modal-dm'); });
    document.getElementById('modal-dm-close').addEventListener('click',function(){ Modal.close('modal-dm'); });
    document.getElementById('dm-delete-btn').addEventListener('click',function(){ if(currentId) deleteItem(currentId); });
    document.getElementById('dm-form').addEventListener('submit',handleSubmit);
    document.querySelectorAll('.emoji-opt').forEach(function(el){
      el.addEventListener('click',function(){ setEmoji(el.dataset.emoji); });
    });
    render();
  }

  return { init:init, render:render };
})();

/* ============================================================
   DRAWER
============================================================ */
var Drawer = (function(){
  var open=false; var date=null;
  function openD(ds){
    date=ds; open=true;
    var d=new Date(ds+'T00:00:00');
    document.getElementById('drawer-title').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 任务';
    refresh(ds);
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer').setAttribute('aria-hidden','false');
    document.getElementById('backdrop').classList.add('show');
    document.getElementById('drawer-add-task').onclick=function(){ Tasks.openNew(ds); };
  }
  function closeD(){
    open=false; date=null;
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer').setAttribute('aria-hidden','true');
    document.getElementById('backdrop').classList.remove('show');
  }
  function refresh(ds){
    var tasks=Store.getTasks().filter(function(t){ return t.ddl===ds; });
    var body=document.getElementById('drawer-body');
    if(!tasks.length){ body.innerHTML=renderEmpty('calendar-x','这天没有任务','点击右上角 + 新建'); reinitIcons(body); return; }
    var h='<div style="display:flex;flex-direction:column;gap:var(--space-2)">';
    tasks.forEach(function(t){ h+=renderTaskCard(t); }); h+='</div>';
    body.innerHTML=h; attachCardHandlers(body);
  }
  function init(){
    document.getElementById('drawer-close').addEventListener('click',closeD);
    document.getElementById('backdrop').addEventListener('click',closeD);
  }
  return { init:init, open:openD, close:closeD, isOpen:function(){ return open; }, getDate:function(){ return date; }, refresh:refresh };
})();

/* ============================================================
   MODAL
============================================================ */
var Modal = (function(){
  function open(id){
    var el=document.getElementById(id); if(!el) return;
    el.classList.add('open'); el.setAttribute('aria-hidden','false');
    document.getElementById('backdrop').classList.add('show');
  }
  function close(id){
    var el=document.getElementById(id); if(!el) return;
    el.classList.remove('open'); el.setAttribute('aria-hidden','true');
    if(!Drawer.isOpen()) document.getElementById('backdrop').classList.remove('show');
  }
  function init(){
    // Click outside modal box closes it
    ['modal-task','modal-dm'].forEach(function(id){
      var wrap=document.getElementById(id); if(!wrap) return;
      wrap.addEventListener('click',function(e){ if(e.target===wrap) close(id); });
    });
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape') return;
      if(document.getElementById('modal-task').classList.contains('open')) close('modal-task');
      else if(document.getElementById('modal-dm').classList.contains('open')) close('modal-dm');
      else if(Drawer.isOpen()) Drawer.close();
    });
  }
  return { open:open, close:close, init:init };
})();

/* ============================================================
   TABS
============================================================ */
function initTabs(){
  var btns=document.querySelectorAll('.tab-btn');
  var panels=document.querySelectorAll('.tab-panel');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      var tab=btn.dataset.tab;
      btns.forEach(function(b){ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      panels.forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
      document.getElementById('panel-'+tab).classList.add('active');
    });
  });
}

/* ============================================================
   THEME TOGGLE
============================================================ */
function initTheme(){
  var btn=document.getElementById('theme-toggle');
  var root=document.documentElement;
  var current=root.getAttribute('data-theme')||'light';
  function apply(t){
    current=t; root.setAttribute('data-theme',t);
    btn.innerHTML=t==='dark'?'<i data-lucide="sun"></i>':'<i data-lucide="moon"></i>';
    reinitIcons(btn);
  }
  apply(current);
  btn.addEventListener('click',function(){ apply(current==='dark'?'light':'dark'); });
}

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){ e.preventDefault(); Tasks.openNew(); }

/* ============================================================
   LANDING PAGE
============================================================ */
(function(){
  var lp=document.getElementById('landing-page');
  if(!lp) return;

  // Particles canvas
  var canvas=document.getElementById('landing-particles');
  var ctx=canvas.getContext('2d');
  var W,H,pts=[];
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  var primary=getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim()||'#7c5cff';
  function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:Math.random()*2+1, a:Math.random() }; }
  for(var i=0;i<55;i++) pts.push(mkPt());

  var raf;
  function drawPts(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0) p.x=W; if(p.x>W) p.x=0;
      if(p.y<0) p.y=H; if(p.y>H) p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      var isDark=document.documentElement.getAttribute('data-theme')==='dark';
      ctx.fillStyle=isDark?'rgba(167,139,250,0.5)':'rgba(124,92,255,0.35)';
      ctx.fill();
    });
    // draw lines between nearby pts
    for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++){
      var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){
        var alpha=(1-dist/120)*(document.documentElement.getAttribute('data-theme')==='dark'?0.25:0.12);
        ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle='rgba(124,92,255,'+alpha+')'; ctx.lineWidth=1; ctx.stroke();
      }
    }
    raf=requestAnimationFrame(drawPts);
  }
  drawPts();

  // Shimmer loop on button
  var shine=document.getElementById('landing-shine');
  var btn=document.getElementById('landing-enter-btn');
  function shimmerLoop(){
    if(!lp.parentNode) return;
    shine.style.transition='none'; shine.style.transform='translateX(-100%)';
    setTimeout(function(){
      shine.style.transition='transform 0.6s ease'; shine.style.transform='translateX(200%)';
    },50);
    setTimeout(shimmerLoop,2400);
  }
  shimmerLoop();

  // Button hover
  btn.addEventListener('mouseenter',function(){
    btn.style.transform='translateY(-2px) scale(1.03)';
    btn.style.boxShadow='0 8px 32px rgba(124,92,255,.55)';
    document.getElementById('landing-arrow').style.transform='translateX(4px)';
  });
  btn.addEventListener('mouseleave',function(){
    btn.style.transform=''; btn.style.boxShadow='0 4px 20px rgba(124,92,255,.4)';
    document.getElementById('landing-arrow').style.transform='';
  });
  btn.addEventListener('mousedown',function(){ btn.style.transform='scale(.97)'; });
  btn.addEventListener('mouseup',function(){ btn.style.transform='translateY(-2px) scale(1.03)'; });

  function enterApp(){
    cancelAnimationFrame(raf);
    lp.style.transition='opacity .5s ease, transform .5s ease';
    lp.style.opacity='0'; lp.style.transform='scale(1.04)';
    setTimeout(function(){ lp.style.display='none'; }, 500);
  }
  btn.addEventListener('click',enterApp);
  document.addEventListener('keydown',function onKey(e){
    if(e.key==='Enter'){ enterApp(); document.removeEventListener('keydown',onKey); }
  });
})();
