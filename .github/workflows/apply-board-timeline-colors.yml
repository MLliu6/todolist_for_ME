name: Apply board and timeline quadrant colors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-board-timeline-colors.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scoped board and timeline colors
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          marker = ".q-tasks{display:flex;flex-direction:column;gap:var(--space-2);min-height:60px;min-width:0}\n\n/* Task card */"
          scoped_block = """.q-tasks{display:flex;flex-direction:column;gap:var(--space-2);min-height:60px;min-width:0}

/* Scoped task-board/timeline quadrant colors; calendar keeps global purple quadrant tokens */
#panel-tasks,#panel-timeline{
  --board-q1:#b66a6a;--board-q1-bg:#f7e9e9;--board-q1-soft:rgba(182,106,106,.26);
  --board-q2:#b69a55;--board-q2-bg:#fbf3df;--board-q2-soft:rgba(182,154,85,.26);
  --board-q3:#6f9878;--board-q3-bg:#edf5ef;--board-q3-soft:rgba(111,152,120,.26);
  --board-q4:#d8d3ca;--board-q4-bg:#fbfaf6;--board-q4-soft:rgba(216,211,202,.38);
  --timeline-q1:var(--board-q1);--timeline-q2:var(--board-q2);--timeline-q3:var(--board-q3);--timeline-q4:var(--board-q4);
  --timeline-text-q1:#fff;--timeline-text-q2:#fff;--timeline-text-q3:#fff;--timeline-text-q4:#4f4942;
}
[data-theme="dark"] #panel-tasks,[data-theme="dark"] #panel-timeline{
  --board-q1:#d08b8b;--board-q1-bg:#3a282d;--board-q1-soft:rgba(208,139,139,.28);
  --board-q2:#d1b66c;--board-q2-bg:#3a3321;--board-q2-soft:rgba(209,182,108,.28);
  --board-q3:#91b397;--board-q3-bg:#23352b;--board-q3-soft:rgba(145,179,151,.28);
  --board-q4:#ece7df;--board-q4-bg:#302e2b;--board-q4-soft:rgba(236,231,223,.26);
  --timeline-text-q4:#2a2723;
}
#panel-tasks .q-panel.q1 .q-badge{background:var(--board-q1)}#panel-tasks .q-panel.q1{border-color:var(--board-q1-soft)}
#panel-tasks .q-panel.q2 .q-badge{background:var(--board-q2)}#panel-tasks .q-panel.q2{border-color:var(--board-q2-soft)}
#panel-tasks .q-panel.q3 .q-badge{background:var(--board-q3)}#panel-tasks .q-panel.q3{border-color:var(--board-q3-soft)}
#panel-tasks .q-panel.q4 .q-badge{background:var(--board-q4)}#panel-tasks .q-panel.q4{border-color:var(--board-q4-soft)}
#panel-tasks .task-card.q1{--task-color:var(--board-q1);--task-bg:var(--board-q1-bg)}
#panel-tasks .task-card.q2{--task-color:var(--board-q2);--task-bg:var(--board-q2-bg)}
#panel-tasks .task-card.q3{--task-color:var(--board-q3);--task-bg:var(--board-q3-bg)}
#panel-tasks .task-card.q4{--task-color:var(--board-q4);--task-bg:var(--board-q4-bg)}

/* Task card */"""

          if 'Scoped task-board/timeline quadrant colors' not in s:
              if marker not in s:
                  raise SystemExit('CSS insertion marker not found')
              s = s.replace(marker, scoped_block, 1)

          old = "style=\"left:'+a.left+'%;top:'+(6+a.layer*30)+'px;z-index:'+(10+a.layer)+';--bar-color:var(--color-'+(t.quadrant||'primary')+');background:var(--color-'+(t.quadrant||'primary')+')\""
          new = "style=\"left:'+a.left+'%;top:'+(6+a.layer*30)+'px;z-index:'+(10+a.layer)+';--bar-color:var(--timeline-'+(t.quadrant||'q2')+', var(--color-'+(t.quadrant||'q2')+'));background:var(--timeline-'+(t.quadrant||'q2')+', var(--color-'+(t.quadrant||'q2')+'));color:var(--timeline-text-'+(t.quadrant||'q2')+', #fff)\""
          if old in s:
              s = s.replace(old, new, 1)
          elif '--bar-color:var(--timeline-' in s:
              pass
          else:
              raise SystemExit('Timeline inline style marker not found')

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit scoped color patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-board-timeline-colors.yml
          git add index.html
          git commit -m "style: scope board and timeline quadrant colors"
          git push
